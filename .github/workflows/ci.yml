---
name: CI
concurrency:
  group: pr-ci-ci.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ci_changes:
    name: Select validation paths
    runs-on: ski-kvm-hodl-or-not-here-we-come
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_validation: "${{ steps.paths.outputs.run_validation }}"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - id: paths
      env:
        GH_TOKEN: "${{ github.token }}"
        CI_INCLUDE_PATHS: '["hodl/**","tests/**","pyproject.toml","uv.lock",".github/workflows/ci.yml"]'
        CI_IGNORE_PATHS: "[]"
      run: python3 .github/scripts/ci_changes.py
  validate:
    name: Lint, types and local fork tests
    runs-on: ski-kvm-hodl-or-not-here-we-come
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
      with:
        version: 0.13.4
        python-version: '3.12'
        enable-cache: true
    - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf
      with:
        version: v1.10.0
    - run: uv sync --locked --all-groups
    - run: uv run --locked ruff format --check hodl tests
    - run: uv run --locked ruff check hodl tests
    - run: uv run --locked ty check
    - run: uv run --locked pytest
    needs:
    - ci_changes
    if: "${{ needs.ci_changes.outputs.run_validation == 'true' }}"
  ci_gate:
    name: CI (ci.yml)
    if: "${{ !cancelled() }}"
    needs:
    - ci_changes
    - validate
    runs-on: ski-kvm-hodl-or-not-here-we-come
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify validation contract
      env:
        CI_GATE_NEEDS: "${{ toJSON(needs) }}"
        CI_EXPECTED_JOBS: '["validate"]'
      run: |-
        python3 -m unittest discover -s .github/scripts -p test_ci_contract.py
        python3 .github/scripts/ci_gate.py
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch:
