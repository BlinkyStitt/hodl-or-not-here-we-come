name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'hodl/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, types and local fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.4'
          python-version: '3.12'
          enable-cache: true
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.8.4
      - run: uv sync --locked --all-groups
      - run: uv run --locked ruff format --check hodl tests
      - run: uv run --locked ruff check hodl tests
      - run: uv run --locked ty check
      - run: uv run --locked pytest
